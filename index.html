<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f3a93" />
    <title>SCRPG Aid</title>
    <script>
      // Apply the color theme before the first paint, so it never flashes the wrong one.
      // Mirrors readPreference and resolveTheme in src/theme/theme.ts; keep them in sync.
      ;(function () {
        var pref = 'system'
        try {
          var stored = localStorage.getItem('scrpg-theme')
          if (stored === 'light' || stored === 'dark' || stored === 'system') pref = stored
        } catch (e) {}
        var light = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
        var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        var theme = pref === 'system' ? (light && !dark ? 'light' : 'dark') : pref
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#2c4aa8' : '#1f3a93')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
