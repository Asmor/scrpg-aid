<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Library, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.theme-light{--bg:#F6F7FB;--surface:#FFFFFF;--surface2:#EEF0F6;--text:#1A1D2B;--muted:#565C70;--border:#DDE0EA;--accent:#4347C9;--on-accent:#FFFFFF;--accent-soft:#E8E9FA;--danger:#8E2BA0;--g:#72CC82;--g-ink:#1A1D2B;--y:#F5D044;--y-ink:#1A1D2B;--r:#F28A80;--r-ink:#1A1D2B}
.theme-dark{--bg:#12141C;--surface:#1B1E2A;--surface2:#232736;--text:#E8EAF2;--muted:#A3A9BF;--border:#2C3042;--accent:#9599FF;--on-accent:#12141C;--accent-soft:#262A4A;--danger:#D07BE0;--g:#1D6E31;--g-ink:#E8EAF2;--y:#E3B600;--y-ink:#12141C;--r:#A8261F;--r-ink:#E8EAF2}
.m{position:relative;width:390px;min-height:1500px;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.5;overflow:hidden}
.m h1,.m h2{font-family:'Barlow Condensed',sans-serif;font-weight:700;margin:0;line-height:1.15}
.m button,.m input{font:inherit;color:inherit}
.bar{display:flex;align-items:center;gap:4px;padding:8px 8px 8px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:6px 12px;min-height:44px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--text);box-sizing:border-box;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.quiet{border-color:transparent;background:transparent}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;background:transparent;border-radius:8px;cursor:pointer;color:var(--text);flex:none}
.wrap{padding:12px 16px 40px;display:flex;flex-direction:column;gap:12px}
.viewbtn{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;padding:0;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:28px}
.tools{display:flex;gap:8px}
.search{flex:1;display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:0 10px;min-height:44px;box-sizing:border-box}
.search input{border:0;background:transparent;outline:none;flex:1;min-width:0}
.count{background:var(--accent);color:var(--on-accent);border-radius:999px;font-size:12px;font-weight:700;padding:0 7px}
.ftags{display:flex;gap:6px;flex-wrap:wrap}
.ftag{display:inline-flex;align-items:center;border:1px solid var(--accent);background:var(--accent-soft);border-radius:6px;padding:0 2px 0 8px;min-height:34px;font-size:14px;font-weight:600}
.ftag button{border:0;background:transparent;width:32px;height:32px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.list{background:var(--surface);border:1px solid var(--border);border-radius:12px}
.item{display:flex;gap:10px;padding:12px 8px 12px 14px;align-items:flex-start}
.item + .item{border-top:1px solid var(--border)}
.name{font-weight:600;color:var(--text);text-decoration:none}
.draft{font-size:11px;font-weight:700;letter-spacing:.06em;border:1px dashed var(--muted);color:var(--muted);border-radius:5px;padding:0 5px;margin-left:6px}
.sub{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px}
.zchip{border-radius:5px;padding:1px 6px;font-size:11px;font-weight:700;letter-spacing:.08em}
.zg{background:var(--g);color:var(--g-ink)}.zy{background:var(--y);color:var(--y-ink)}.zr{background:var(--r);color:var(--r-ink)}
.zo{background:var(--surface2);color:var(--text);box-shadow:inset 0 0 0 1px var(--border)}
.tag{display:inline-flex;align-items:center;border:1px solid var(--border);background:var(--surface2);border-radius:6px;padding:0 0 0 8px;min-height:28px;font-size:13px}
.tagx{border:0;background:transparent;width:28px;height:28px;padding:0;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted)}
.small{font-size:13px}.muted{color:var(--muted)}
.scrim{position:absolute;inset:0;background:rgba(10,12,20,.55);z-index:4}
.sheet{position:absolute;left:0;right:0;top:300px;bottom:0;z-index:5;background:var(--surface);border-radius:16px 16px 0 0;box-shadow:0 -12px 32px rgba(0,0,0,.35);padding:16px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box}
.sheet h2{font-size:22px}
.chip{display:inline-flex;align-items:center;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:3px 14px;min-height:40px;cursor:pointer;box-sizing:border-box}
.chip.on{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.opt{display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:8px 4px;min-height:44px;cursor:pointer;width:100%;border-bottom:1px solid var(--border)}
.opt .n{margin-left:auto;color:var(--muted);font-size:13px}
.box{width:18px;height:18px;border:1.5px solid var(--muted);border-radius:4px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.box.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
</style>
</helmet>
<div class="m {{themeClass}}">
  <header class="bar">
    <span style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:21px" class="grow">SCRPG Aid</span>
    <button type="button" class="iconbtn" aria-label="Play together"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.6-3.4 3.2-5.5 6.5-5.5s5.9 2.1 6.5 5.5"></path><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8"></path><path d="M18.5 14.8c1.6.8 2.7 2.6 3 5.2"></path></svg></button>
    <button type="button" class="iconbtn" aria-label="Menu: data, color scheme"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
  </header>
  <main class="wrap">
    <div style="display:flex;align-items:center;gap:8px">
      <button type="button" class="viewbtn" aria-haspopup="dialog">{{viewName}}<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
      <span class="grow"></span>
      <a class="btn primary" href="#">New</a>
    </div>
    <div class="tools">
      <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="color:var(--muted)"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><input type="search" placeholder="Search by name" aria-label="Search by name" value="{{q}}" onChange="{{setQ}}"></label>
      <button type="button" class="btn" aria-haspopup="dialog" onClick="{{openSheet}}">Filters<sc-if value="{{hasFilterCount}}" hint-placeholder-val="{{true}}"><span class="count">{{filterCount}}</span></sc-if></button>
    </div>
    <sc-if value="{{hasTags}}" hint-placeholder-val="{{true}}">
      <div class="ftags">
        <sc-for list="{{activeTags}}" as="t" hint-placeholder-count="1"><span class="ftag">{{t.name}}<button type="button" aria-label="{{t.removeLabel}}" onClick="{{t.remove}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></span></sc-for>
      </div>
    </sc-if>
    <div class="list" role="list" aria-label="Library">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
        <div class="item" role="listitem">
          <div class="grow">
            <a class="name" href="#">{{r.name}}</a><sc-if value="{{r.isDraft}}" hint-placeholder-val="{{false}}"><span class="draft">DRAFT</span></sc-if>
            <div class="sub">{{r.type}} · {{r.details}}</div>
            <div class="st">
              <sc-if value="{{r.hasGames}}" hint-placeholder-val="{{true}}"><span class="small muted">In {{r.gamesText}}</span></sc-if>
              <sc-for list="{{r.tags}}" as="t" hint-placeholder-count="2"><span class="tag">{{t.name}}<button type="button" class="tagx" aria-label="{{t.removeLabel}}" onClick="{{t.remove}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></span></sc-for>
            </div>
          </div>
          <a class="btn" href="#" aria-label="{{r.primaryLabel}}">{{r.primary}}</a>
          <button type="button" class="iconbtn" aria-label="{{r.moreLabel}}" aria-haspopup="menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>
        </div>
      </sc-for>
    </div>
    <div class="small muted">{{shownText}} · Press and hold an item to select several.</div>
  </main>

  <sc-if value="{{sheetOpen}}" hint-placeholder-val="{{false}}">
    <div class="scrim" onClick="{{closeSheet}}"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="fh">
      <div style="display:flex;align-items:center"><h2 id="fh" class="grow">Filters</h2><button type="button" class="btn quiet" onClick="{{clear}}">Clear</button></div>
      <div><div class="small muted" style="margin-bottom:6px">Type</div>
        <div style="display:flex;gap:8px"><sc-for list="{{typeChips}}" as="t" hint-placeholder-count="2"><button type="button" class="chip {{t.cls}}" aria-pressed="{{t.on}}" onClick="{{t.toggle}}">{{t.label}}</button></sc-for></div>
      </div>
      <div class="grow" style="overflow:auto"><div class="small muted">Tags · items must have every tag you pick</div>
        <sc-for list="{{tagOptions}}" as="o" hint-placeholder-count="6">
          <button type="button" class="opt" role="menuitemcheckbox" aria-checked="{{o.on}}" onClick="{{o.toggle}}"><span class="box {{o.boxCls}}" aria-hidden="true"><sc-if value="{{o.on}}" hint-placeholder-val="{{false}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"></path></svg></sc-if></span>{{o.name}}<span class="n">{{o.count}}</span></button>
        </sc-for>
      </div>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px"><button type="button" class="btn">Save search</button><button type="button" class="btn primary" onClick="{{closeSheet}}">{{showLabel}}</button></div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":1500}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { q: '', types: [], tags: ['scene-3'], sheet: false };
    this.items = [
      { name: 'Maya Reyes', type: 'Hero', details: 'Speedster · Accident', zone: 'yellow', hp: '18 / 30', tags: ['thursday-game'] },
      { name: 'Gravelord', type: 'Villain', details: 'Bully Overlord · Major', zone: 'green', hp: '40 / 40', tags: ['thursday-game', 'scene-3'] },
      { name: 'Paradigm', type: 'Hero', details: 'Modular Blaster · Alien', zone: 'green', hp: '32 / 32', tags: ['thursday-game'] },
      { name: 'Unnamed hero', type: 'Hero', draft: true, details: 'Step 2 of 8', tags: [] },
      { name: 'Rust Hound', type: 'Villain', draft: true, details: 'Step 3 of 6', tags: ['scene-3', 'prep'] },
      { name: 'Swarmwright', type: 'Hero', details: 'Minion Maker · Accident', zone: 'green', hp: '30 / 30', tags: ['thursday-game', 'prep'] },
      { name: 'Cinder', type: 'Villain', details: 'Bully Overlord · Minor', zone: 'green', hp: '24 / 24', tags: ['scene-2', 'thursday-game'] },
      { name: 'Duality', type: 'Hero', details: 'Divided Speedster · Supernatural', zone: 'red', hp: '6 / 28', tags: ['one-shot'] },
      { name: 'Static Choir', type: 'Villain', details: 'Bully Overlord · Minor', zone: 'green', hp: '24 / 24', tags: ['scene-3'] },
      { name: 'Shiftback', type: 'Hero', details: 'Form Changer · Genetic', zone: 'out', hp: '0 / 29', tags: ['one-shot'] }
    ];
  }
  renderVals() {
    const s = this.state;
    const Z = { green: ['zg', 'GREEN'], yellow: ['zy', 'YELLOW'], red: ['zr', 'RED'], out: ['zo', 'OUT'] };
    const toggleIn = (arr, v) => arr.includes(v) ? arr.filter((x) => x !== v) : [...arr, v];
    const match = (it) => (!s.q || it.name.toLowerCase().includes(s.q.toLowerCase())) && (!s.types.length || s.types.includes(it.type)) && s.tags.every((t) => it.tags.includes(t));
    const filtered = this.items.filter(match);
    const counts = {};
    this.items.forEach((it) => it.tags.forEach((t) => { counts[t] = (counts[t] || 0) + 1; }));
    const fc = s.types.length + s.tags.length;
    return {
      themeClass: 'theme-' + (this.props.theme || 'dark'),
      viewName: s.tags.length === 1 && s.tags[0] === 'scene-3' && !s.types.length ? 'Scene 3' : (fc ? 'Search results' : 'All'),
      q: s.q, setQ: (e) => this.setState({ q: e.target.value }),
      hasFilterCount: fc > 0, filterCount: fc,
      hasTags: s.tags.length > 0,
      activeTags: s.tags.map((t) => ({ name: t, removeLabel: 'Remove tag filter ' + t, remove: () => this.setState({ tags: s.tags.filter((x) => x !== t) }) })),
      rows: filtered.map((it) => ({
        ...it, isDraft: !!it.draft,
        tags: it.tags.map((t) => ({ name: t, removeLabel: 'Remove ' + t + ' from ' + it.name, remove: () => { it.tags = it.tags.filter((x) => x !== t); this.forceUpdate(); } })), hasGames: ['Maya Reyes', 'Gravelord', 'Paradigm', 'Swarmwright', 'Static Choir', 'Duality'].includes(it.name), gamesText: it.name === 'Duality' ? 'Saturday one-shot' : 'Thursday game',
        primary: it.draft ? 'Continue' : 'Play', primaryLabel: (it.draft ? 'Continue ' : 'Play ') + it.name, moreLabel: 'More actions for ' + it.name
      })),
      shownText: fc || s.q ? 'Showing ' + filtered.length + ' of ' + this.items.length : this.items.length + ' items',
      sheetOpen: s.sheet, openSheet: () => this.setState({ sheet: true }), closeSheet: () => this.setState({ sheet: false }),
      clear: () => this.setState({ types: [], tags: [] }),
      typeChips: ['Hero', 'Villain'].map((t) => ({ label: t + 's', on: s.types.includes(t), cls: s.types.includes(t) ? 'on' : '', toggle: () => this.setState({ types: toggleIn(s.types, t) }) })),
      tagOptions: Object.keys(counts).sort().map((t) => ({ name: t, count: counts[t], on: s.tags.includes(t), boxCls: s.tags.includes(t) ? 'on' : '', toggle: () => this.setState({ tags: toggleIn(s.tags, t) }) })),
      showLabel: 'Show ' + filtered.length
    };
  }
}
</script>
</body>
</html>
