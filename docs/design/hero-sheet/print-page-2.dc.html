<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Printed sheet, page 2</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
.pg{width:816px;height:1056px;box-sizing:border-box;padding:48px 52px;background:#FFFFFF;color:#1A1D2B;font-family:Inter,system-ui,sans-serif;font-size:13.5px;line-height:1.45;display:flex;flex-direction:column}
.pg h1,.pg h2{font-family:'Barlow Condensed',sans-serif;font-weight:700;margin:0}
.muted{color:#565C70}
.sh{font-size:20px;border-bottom:1.5px solid #1A1D2B;padding-bottom:2px;margin:0 0 10px}
.band{border:1px solid #B9BDCB;border-radius:8px;overflow:hidden;margin-bottom:10px}
.bh{padding:3px 12px;font-weight:700;letter-spacing:.1em;font-size:12px;color:#1A1D2B}
.zg{background:#72CC82}.zy{background:#F5D044}.zr{background:#F28A80}.zo{background:#EEF0F6}
.abl{display:grid;grid-template-columns:196px 58px minmax(0,1fr);gap:10px;padding:6px 12px;border-top:1px solid #DDE0EA;align-items:baseline}
.abl:first-of-type{border-top:0}
.nm{font-weight:600;display:flex;gap:6px;align-items:center}
.ic{display:inline-flex;gap:2px}.ic img{height:16px;width:auto}
.tp{font-size:12px;color:#565C70}
.ai{height:1em;width:auto;vertical-align:-.15em;margin-right:2px}
.foot{margin-top:auto;display:flex;justify-content:space-between;font-size:12px;color:#565C70;border-top:1px solid #DDE0EA;padding-top:6px}
</style>
</helmet>
<div class="pg">
  <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px">
    <h1 style="font-size:24px">Maya Reyes <span class="muted" style="font-family:Inter,sans-serif;font-weight:400;font-size:14px">Afterimage</span></h1>
    <span class="muted">Upper Class · Accident · Speedster · Lone Wolf</span>
  </div>
  <h2 class="sh">Abilities</h2>
  <sc-for list="{{bands}}" as="b" hint-placeholder-count="4">
    <div class="band">
      <div class="{{b.cls}}">{{b.label}}</div>
      <sc-for list="{{b.rows}}" as="a" hint-placeholder-count="3">
        <div class="abl">
          <div class="nm"><sc-if value="{{a.hasIcons}}" hint-placeholder-val="{{true}}"><span class="ic"><sc-for list="{{a.icons}}" as="i" hint-placeholder-count="2"><img src="{{i.src}}" alt="{{i.alt}}"></sc-for></span></sc-if><span>{{a.name}}</span></div>
          <div class="tp">{{a.type}}</div>
          <div><sc-for list="{{a.text}}" as="s" hint-placeholder-count="3"><span><sc-if value="{{s.icon}}" hint-placeholder-val="{{false}}"><img class="ai" src="{{s.src}}" alt=""></sc-if>{{s.text}}</span></sc-for></div>
        </div>
      </sc-for>
    </div>
  </sc-for>
  <div class="foot"><span>Maya Reyes · Sentinel Comics RPG</span><span>Page 2 of 2</span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":816,"height":1056}}'>
class Component extends DCLogic {
  renderVals() {
    const I = { attack: '/icons/action/attack.png', boost: '/icons/action/boost.png', defend: '/icons/action/defend.png', hinder: '/icons/action/hinder.png', overcome: '/icons/action/overcome.png' };
    const L = { attack: 'Attack', boost: 'Boost', defend: 'Defend', hinder: 'Hinder', overcome: 'Overcome' };
    const parse = t => t.split(/(\{\w+\})/).filter(x => x).map(x => { const m = x.match(/^\{(\w+)\}$/); return m ? { icon: true, src: I[m[1]], text: '' } : { icon: false, text: x }; });
    const ab = (name, type, text) => { const acts = [...text.matchAll(/\{(\w+)\}/g)].map(m => m[1]); return { name, type, hasIcons: acts.length > 0, icons: acts.map(a => ({ src: I[a], alt: L[a] })), text: parse(text) }; };
    return { bands: [
      { label: 'GREEN', cls: 'bh zg', rows: [ab('Immunity', 'Inherent', 'You do not take damage from Fire.'), ab('Always on the Move', 'Action', '{attack}Attack using Speed. {defend}Defend yourself using your Min die.'), ab('Non-stop Assault', 'Action', '{attack}Attack multiple targets using Alertness. Use your Min die. {hinder}Hinder each target equal to your Mid die.'), ab('Principle of Business', 'Action', '{overcome}Overcome in a situation related to the field of your business or knowing locals. Use your Max die. You and each of your allies gain a hero point.'), ab('Principle of the Gearhead', 'Action', '{overcome}Overcome a technological challenge and use your Max die. You and each of your allies gain a hero point.')] },
      { label: 'YELLOW', cls: 'bh zy', rows: [ab('Inflict', 'Action', '{attack}Attack using Fire. {hinder}Hinder that same target using your Min die.'), ab('Area Alteration', 'Action', '{boost}Boost any number of nearby targets using Agility. Use your Max die.'), ab('Speedy Analysis', 'Action', '{boost}Boost multiple targets using Flight. Use your Max die.')] },
      { label: 'RED', cls: 'bh zr', rows: [ab('Paragon Feat', 'Action', '{overcome}Overcome using Agility in a situation that requires you to be more than humanly capable, like an extreme feat of strength or speed. Use your Max+Min dice. {boost}Boost all nearby allies with your Mid die.'), ab('Push Your Limits', 'Inherent', 'You have no limit on amount of Reactions you can take. Each time you use a Reaction after the first one each turn, take 1 irreducible damage or take a minor twist.')] },
      { label: 'OUT', cls: 'bh zo', rows: [ab('Out ability', 'Action', '{boost}Boost an ally by rolling your single Fitness die.')] }
    ] };
  }
}
</script>
</body>
</html>
